<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bear Lake County Planning Minutes Search</title><style>body{margin:0;background:#111c26;color:#edf3f7;font:15px system-ui}main{max-width:980px;margin:30px auto;padding:0 16px}input,select{background:#263948;color:white;border:1px solid #718391;border-radius:6px;padding:10px;font:inherit}input{width:min(100%,500px);box-sizing:border-box}button{background:#b5dcf3;border:0;padding:9px 12px;border-radius:6px}article{border:1px solid #465967;border-radius:10px;padding:15px;margin:12px 0;background:#1c2d3a}a{color:#9cdbff}small{color:#b4c5cf}p{line-height:1.5}.snippet{white-space:pre-wrap;max-height:180px;overflow:auto}mark{background:#f4d782;color:#222}#stats{margin:10px 0}</style></head><body><main><h1>Bear Lake County Planning Minutes</h1><p>Search OCR text from official county PDFs. These are meeting discussions, <b>not verified approvals</b>. Always open the original PDF before relying on a decision.</p><input id="q" placeholder="Search: conditional use, cabin, subdivision…"><select id="topic"><option value="">All topics</option></select><p id="stats">Loading indexed documents…</p><div id="results"></div><p><a href="../../README.md">Research project</a> · <a href="https://www.bearlakecounty.info/planning-and-zoning.html">County source archive</a></p></main><script>
let data=null;const q=document.getElementById('q'),topic=document.getElementById('topic'),stats=document.getElementById('stats'),results=document.getElementById('results');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){
 if(!data)return;const term=q.value.trim().toLowerCase(),cat=topic.value,docs=Object.fromEntries(data.documents.map(d=>[d.id,d]));
 let rows=[];
 if(cat){rows=data.topic_hits.filter(h=>h.topic===cat&&(!term||h.excerpt.toLowerCase().includes(term)||docs[h.doc_id]?.title.toLowerCase().includes(term))).map(h=>({...h,body:h.excerpt}));}
 else {rows=data.pages.filter(p=>!term||p.body.toLowerCase().includes(term)||docs[p.doc_id]?.title.toLowerCase().includes(term)).map(p=>({...p,body:p.body.slice(Math.max(0,term?p.body.toLowerCase().indexOf(term)-150:0),Math.max(0,term?p.body.toLowerCase().indexOf(term)-150:0)+500)}));}
 stats.textContent=rows.length+' matching page'+(rows.length===1?'':'s')+' / topic excerpts · '+data.documents.length+' documents indexed · '+data.pages.length+' pages. OCR may be inaccurate.';
 results.innerHTML=rows.slice(0,100).map(p=>{const d=docs[p.doc_id];return '<article><b>'+esc(d.title)+'</b> · PDF page '+p.page+(p.topic?' · '+esc(p.topic):'')+'<p class="snippet">'+esc(p.body)+'</p><a target="_blank" rel="noopener" href="'+esc(d.url)+'#page='+p.page+'">Open original county PDF at page '+p.page+'</a></article>'}).join('')||'<p>No matches. Try broader terms.</p>';
}
fetch('index-data.json').then(r=>{if(!r.ok)throw Error('Search data not published');return r.json()}).then(d=>{data=d;for(const t of d.topics){const o=document.createElement('option');o.value=t;o.textContent=t;topic.append(o)}render()}).catch(e=>stats.textContent='Index unavailable: '+e.message);
q.oninput=render;topic.onchange=render;
</script></body></html>
