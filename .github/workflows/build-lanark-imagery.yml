name: Build Lanark terrain imagery
on:
  workflow_dispatch:
  push:
    paths:
      - '3d/scripts/fetch_imagery.py'
      - '.github/workflows/build-lanark-imagery.yml'
permissions:
  contents: write
concurrency:
  group: lanark-imagery
  cancel-in-progress: false
jobs:
  imagery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Download visual imagery
        run: python 3d/scripts/fetch_imagery.py
      - name: Commit imagery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 3d/viewer/imagery.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Update Lanark terrain visual imagery"
            git pull --rebase
            git push
          fi
