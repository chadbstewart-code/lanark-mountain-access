name: Analyze Emigration Canyon historical winds
on:
  workflow_dispatch:
  push:
    paths:
      - '3d/scripts/analyze_emigration_winds.py'
      - '.github/workflows/analyze-emigration-winds.yml'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python 3d/scripts/analyze_emigration_winds.py
      - name: Commit wind data and analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 3d/data/weather/emigration-10021-wind-raw.json 3d/data/weather/emigration-10021-wind-summary.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive and analyze Emigration Canyon historical winds"
            git pull --rebase
            git push
          fi
