name: Build Lanark 3D terrain
on:
  workflow_dispatch:
  push:
    paths:
      - '3d/scripts/**'
      - '.github/workflows/build-lanark-terrain.yml'
permissions:
  contents: write
concurrency:
  group: lanark-terrain
  cancel-in-progress: false
jobs:
  terrain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests rasterio numpy
      - name: Fetch and validate measured USGS 3DEP elevations
        run: |
          python 3d/scripts/fetch_terrain.py --size 512
          python 3d/scripts/terrain_to_mesh.py 3d/data/terrain/lanark_3dep.tif --grid 160
          python - <<'PY'
          import json,math
          from pathlib import Path
          p=Path('3d/viewer/terrain.json')
          d=json.loads(p.read_text())
          assert d['measured'] is True
          assert d['grid']==160 and len(d['vertices_m'])==160**2
          a=[v[1] for v in d['vertices_m']]
          assert all(math.isfinite(z) for z in a)
          assert 1000<min(a)<max(a)<4000
          assert max(a)-min(a)>5
          print('Validated',len(a),'vertices, elevations',min(a),max(a))
          PY
      - name: Commit validated terrain
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 3d/viewer/terrain.json
          if ! git diff --cached --quiet; then
            git commit -m "Update measured USGS terrain mesh"
            git push
          fi
