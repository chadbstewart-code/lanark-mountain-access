name: Discover Emigration Canyon station coverage
on:
  push:
    paths:
      - '3d/scripts/discover_emigration.py'
      - '.github/workflows/discover-emigration.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python 3d/scripts/discover_emigration.py
      - name: Commit discovery report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 3d/data/weather/emigration-station-discovery.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Emigration Canyon RWIS station identifiers and coverage"
            git pull --rebase
            git push
          fi
