name: Index Bear Lake planning minutes
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/county-minutes/collect.py'
      - 'research/county-minutes/search.py'
      - '.github/workflows/index-bear-lake-minutes.yml'
permissions:
  contents: write
concurrency:
  group: county-minutes-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4 pypdf
      - name: Index 2024–2026 planning minutes
        run: python research/county-minutes/collect.py --groups planning --years 2024 2025 2026 --max-per-group 60
      - name: Validate results
        run: |
          python - <<'PY'
          import json
          m=json.load(open('research/county-minutes/data/manifest.json'))
          indexed=sum(d.get('status')=='indexed' for d in m['documents'])
          print('Indexed',indexed,'documents')
          if indexed<1:raise SystemExit('No documents indexed; inspect discovery')
          PY
      - name: Commit source manifest and searchable index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/county-minutes/data/manifest.json research/county-minutes/data/minutes.sqlite
          if ! git diff --cached --quiet; then
            git commit -m "Update indexed Bear Lake Planning and Zoning minutes"
            git pull --rebase
            git push
          fi
