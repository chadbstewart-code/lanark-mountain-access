name: Inspect Idaho mountain wind archive
on:
  workflow_dispatch:
  push:
    paths:
      - '3d/scripts/inspect_wind_archive.py'
      - '.github/workflows/inspect-lanark-wind.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python 3d/scripts/inspect_wind_archive.py
      - name: Commit verified source metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 3d/data/weather/itd-rwis-schema.json 3d/data/weather/itd-rwis-sample.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive ITD RWIS metadata and sample for wind study"
            git pull --rebase
            git push
          fi
